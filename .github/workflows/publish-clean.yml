# publish-clean — flow AUTOMÁTICO privado → público (one-way).
#
# A cada push na main do repo PRIVADO (fonte full), regenera a versão LIMPA
# (anonimizada, sem docs/_private, com gate --sensitive) e force-push para o repo PÚBLICO.
# Sentido único: o público é ARTEFATO GERADO — nunca editar à mão lá.
#
# AUTENTICAÇÃO (já configurada): deploy key SSH com escopo SÓ do repo público (write-only,
# não expira). Chave privada no secret `PUBLISH_DEPLOY_KEY` (repo privado); chave pública
# registrada como deploy key (read-write) no repo público. Sem o secret, o job roda
# export+gate (CI) e PULA o publish.

name: publish-clean

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-and-publish:
    runs-on: ubuntu-latest
    env:
      PUBLIC_REPO: "fabriciopsouza/metacognition-framework-public"
      NONADMIN_REPO: "fabriciopsouza/metacognition-framework-public-nonadmin"
      PREMIUM_REPO: "fabriciopsouza/metacognition-framework-premium"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Gate de boot (norma) + canário — falha o build se o núcleo regrediu
      - name: Lint núcleo (norma) + canário
        run: |
          python tools/check_core_agnostic.py
          python tools/test_core_agnostic.py

      # Export determinístico + GATE sensível (aborta se token de cliente sobreviver)
      - name: Export limpo (anonimiza + gate --sensitive)
        run: python tools/export-clean.py "${RUNNER_TEMP}/clean"

      - name: Publicar no repo público (SSH deploy key)
        env:
          PUBLISH_DEPLOY_KEY: ${{ secrets.PUBLISH_DEPLOY_KEY }}
        run: |
          if [ -z "${PUBLISH_DEPLOY_KEY}" ]; then
            echo "PUBLISH_DEPLOY_KEY ausente — export+gate validados; publish PULADO (configure o secret p/ ativar o flow)."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${PUBLISH_DEPLOY_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cd "${RUNNER_TEMP}/clean"
          git init -q
          git checkout -q -b main
          git add -A
          git -c user.name="auto-publish" -c user.email="actions@users.noreply.github.com" \
              commit -q -m "publish: export limpo da fonte privada @ ${GITHUB_SHA::7}"
          git remote add target "git@github.com:${PUBLIC_REPO}.git"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" git push -f target main
          echo "Publicado em https://github.com/${PUBLIC_REPO}"

      # Variante NON-ADMIN (ADR-047): MESMA fonte, settings.json sem hooks. Single-source -> multi-distrib.
      - name: Export limpo NON-ADMIN (settings sem hooks)
        run: python tools/export-clean.py "${RUNNER_TEMP}/clean-nonadmin" --nonadmin

      - name: Publicar no repo público NON-ADMIN (SSH deploy key)
        env:
          PUBLISH_DEPLOY_KEY_NONADMIN: ${{ secrets.PUBLISH_DEPLOY_KEY_NONADMIN }}
        run: |
          if [ -z "${PUBLISH_DEPLOY_KEY_NONADMIN}" ]; then
            echo "PUBLISH_DEPLOY_KEY_NONADMIN ausente — export non-admin validado; publish PULADO (configure o secret p/ ativar)."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${PUBLISH_DEPLOY_KEY_NONADMIN}" > ~/.ssh/id_nonadmin
          chmod 600 ~/.ssh/id_nonadmin
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cd "${RUNNER_TEMP}/clean-nonadmin"
          git init -q
          git checkout -q -b main
          git add -A
          git -c user.name="auto-publish" -c user.email="actions@users.noreply.github.com" \
              commit -q -m "publish (non-admin): export limpo @ ${GITHUB_SHA::7}"
          git remote add target "git@github.com:${NONADMIN_REPO}.git"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_nonadmin -o IdentitiesOnly=yes" git push -f target main
          echo "Publicado em https://github.com/${NONADMIN_REPO}"

      # Variante PREMIUM (ADR-049): MESMA fonte, mantém a camada premium (proposta proativa + UX premium).
      # Privado (acesso pago). Mesmo gate sensível (sem dado de cliente nem na premium).
      - name: Export limpo PREMIUM (mantém camada premium)
        run: python tools/export-clean.py "${RUNNER_TEMP}/clean-premium" --premium

      - name: Publicar no repo PREMIUM (SSH deploy key)
        env:
          PUBLISH_DEPLOY_KEY_PREMIUM: ${{ secrets.PUBLISH_DEPLOY_KEY_PREMIUM }}
        run: |
          if [ -z "${PUBLISH_DEPLOY_KEY_PREMIUM}" ]; then
            echo "PUBLISH_DEPLOY_KEY_PREMIUM ausente — export premium validado; publish PULADO."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${PUBLISH_DEPLOY_KEY_PREMIUM}" > ~/.ssh/id_premium
          chmod 600 ~/.ssh/id_premium
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          cd "${RUNNER_TEMP}/clean-premium"
          git init -q
          git checkout -q -b main
          git add -A
          git -c user.name="auto-publish" -c user.email="actions@users.noreply.github.com" \
              commit -q -m "publish (premium): export limpo @ ${GITHUB_SHA::7}"
          git remote add target "git@github.com:${PREMIUM_REPO}.git"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_premium -o IdentitiesOnly=yes" git push -f target main
          echo "Publicado em https://github.com/${PREMIUM_REPO}"
